name = "citesite-api"
main = "index.js"
compatibility_date = "2026-04-24"
routes = [
  { pattern = "api.citesite.net/api/audit*", zone_name = "citesite.net" }
]

[vars]
ANTHROPIC_MODEL = "claude-opus-4-7"
CITESITE_URL = "https://citesite.net"

[[d1_databases]]
binding = "DB"
database_name = "citesite-db"
database_id = "c3773f9a-5b71-4095-9b48-2131eea61eaf"

# Secrets (set with: npx wrangler secret put SECRET_NAME)
# ANTHROPIC_API_KEY
# ADMIN_KEY
# CF_ACCESS_TEAM_DOMAIN
# CF_ACCESS_AUD
# RESEND_API_KEY
# ADMIN_EMAIL