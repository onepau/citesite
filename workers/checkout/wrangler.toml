name = "citesite-checkout"
main = "index.js"
compatibility_date = "2026-04-24"
routes = [
  { pattern = "api.citesite.net/api/checkout", zone_name = "citesite.net" },
  { pattern = "api.citesite.net/api/coupon/validate", zone_name = "citesite.net" }
]

[vars]
PRICE_CHF_CENTS = "4999"
PRICE_CURRENCY = "chf"
PUBLIC_SITE_URL = "https://citesite.net"
STRIPE_PRODUCT_NAME = "CiteSite Full Report"

[[d1_databases]]
binding = "DB"
database_name = "citesite-db"
database_id = "c3773f9a-5b71-4095-9b48-2131eea61eaf"

[[unsafe.bindings]]
name = "CHECKOUT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (set with: npx wrangler secret put SECRET_NAME)
# STRIPE_SECRET_KEY
