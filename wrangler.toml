# CiteSite Frontend - Cloudflare Worker Configuration
name = "citesite"
main = "index.js"
compatibility_date = "2026-04-24"
routes = [
  { pattern = "citesite.net/*", zone_name = "citesite.net" },
  { pattern = "www.citesite.net/*", zone_name = "citesite.net" }
]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
